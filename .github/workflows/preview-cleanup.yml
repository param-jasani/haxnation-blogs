# ═══════════════════════════════════════════════════════════════════════════════
# preview-cleanup.yml — Delete gh-pages/pr-<N>/ when a PR closes
# ═══════════════════════════════════════════════════════════════════════════════
#
# SECURITY MODEL:
#   - Triggered on `pull_request_target: closed` (merge OR reject).
#   - Uses `pull_request_target` DELIBERATELY: at close time we run NO build
#     and NEVER check out PR code — only the `gh-pages` branch. There is no
#     untrusted code execution, so the target variant is safe and required
#     (it still has write permissions after the fork branch is deleted).
#   - PR number is validated as digits; only `pr-<N>/` is ever removed.
#     Production files at the gh-pages root are never touched.
#
# ═══════════════════════════════════════════════════════════════════════════════

name: PR Preview — Cleanup

on:
  pull_request_target:
    branches: [ main ]
    types: [ closed ]

permissions:
  contents: write        # delete pr-<N>/ folder from gh-pages
  pull-requests: write   # comment cleanup confirmation

concurrency:
  group: preview-cleanup-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  cleanup:
    name: Delete gh-pages/pr-<N>/
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📥 Checkout (required — provides the git repo; PR code never used)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # persist-credentials default true — needed to push to gh-pages.
          # Safe: we never build or execute PR code in this workflow.

      - name: 🧹 Delete preview folder
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          if ! [[ "${PR_NUMBER}" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid PR number: ${PR_NUMBER}"
            exit 1
          fi
          PREVIEW_DIR="pr-${PR_NUMBER}"
          echo "Cleaning: ${PREVIEW_DIR}/"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin gh-pages 2>/dev/null || { echo "(no gh-pages branch — nothing to clean)"; exit 0; }
          git checkout gh-pages
          git pull --ff-only origin gh-pages || true

          if [ ! -d "${PREVIEW_DIR}" ]; then
            echo "(folder ${PREVIEW_DIR}/ not present — nothing to clean)"
            exit 0
          fi
          git rm -r --quiet "${PREVIEW_DIR}"
          git commit -m "preview: cleanup ${PREVIEW_DIR} (PR #${PR_NUMBER} closed)"
          git push origin gh-pages
          echo "✅ Removed ${PREVIEW_DIR}/ from gh-pages."

      - name: 💬 Comment cleanup confirmation
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.pull_request.number;
            const merged = context.payload.pull_request.merged;
            const marker = '<!-- haxnation-preview-bot -->';
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber,
            });
            const existing = comments.data.find(c => c.user.type === 'Bot' && c.body.includes(marker));
            const body = `## 🧹 Blog Preview — cleaned up\n\n` +
              `> PR #${prNumber} was ${merged ? '**merged** 🎉' : '**closed**'} — \`gh-pages/pr-${prNumber}/\` deleted.\n\n` +
              (merged
                ? `Production rebuild is deploying; see https://${context.repo.owner}.github.io/blog/ in ~1–2 min.\n`
                : `No production changes were made.\n`) +
              `\n---\n_🤖 Preview bot · cleanup_`;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo, issue_number: prNumber, body,
              });
            }
